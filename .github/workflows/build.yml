name: BitTorrent-Beobachter prüfen und bauen

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"
      - "bittorrent-beobachter-v*"
  pull_request:

permissions:
  contents: read

jobs:
  test-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Python einrichten
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Abhängigkeiten installieren
        run: python -m pip install ".[dev]"

      - name: Tests ausführen
        run: python -m pytest

      - name: Quellcode prüfen
        run: python -m ruff check .

      - name: Python-Dateien kompilieren
        run: >-
          python -m compileall -q
          164_bittorrent_beobachter.py
          bittorrent_beobachter
          tests

  test-and-build-windows:
    needs: test-linux
    runs-on: windows-latest

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Python einrichten
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Abhängigkeiten installieren
        run: python -m pip install ".[dev,build]"

      - name: Tests ausführen
        run: python -m pytest

      - name: Quellcode prüfen
        run: python -m ruff check .

      - name: Tkinter-Laufzeit prüfen
        shell: pwsh
        run: |
          $tkCheck = @'
          import tkinter as tk

          root = tk.Tk()
          try:
              root.withdraw()
              root.update_idletasks()
              patch_level = root.tk.call("info", "patchlevel")
              if not tk.TkVersion or not patch_level:
                  raise RuntimeError("Tcl/Tk meldet keine gültige Version.")
              print(f"Tcl/Tk {patch_level} ist verfügbar.")
          finally:
              root.destroy()
          '@
          $tkCheck | python -
          if ($LASTEXITCODE -ne 0) {
            throw "Die Tkinter-Laufzeitprüfung ist fehlgeschlagen."
          }

      - name: Transparente Onedir-App bauen
        run: python -m PyInstaller --clean --noconfirm BitTorrentBeobachter.spec

      - name: Gebaute EXE prüfen
        shell: pwsh
        run: |
          $executable = Resolve-Path -LiteralPath `
            "dist/BitTorrent-Beobachter/BitTorrent-Beobachter.exe"
          $process = Start-Process -FilePath $executable.Path `
            -ArgumentList "--version" -PassThru
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            $process.WaitForExit()
            throw "Der EXE-Smoke-Test wurde nach 30 Sekunden abgebrochen."
          }
          if ($process.ExitCode -ne 0) {
            throw (
              "Der EXE-Smoke-Test ist mit Exitcode " +
              "$($process.ExitCode) fehlgeschlagen."
            )
          }
          Write-Host "EXE-Smoke-Test mit --version erfolgreich."

      - name: EXE optional mit Herausgeberzertifikat signieren
        if: >-
          ${{
            (github.event_name == 'push' &&
             (github.ref == 'refs/heads/main' ||
              startsWith(github.ref, 'refs/tags/v') ||
              startsWith(github.ref, 'refs/tags/bittorrent-beobachter-v'))) ||
            (github.event_name == 'workflow_dispatch' &&
             github.ref == 'refs/heads/main')
          }}
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            $certificate = Join-Path $env:RUNNER_TEMP "code-signing.pfx"
            try {
              $programFilesX86 = ${env:ProgramFiles(x86)}
              if ([string]::IsNullOrWhiteSpace($programFilesX86)) {
                throw "ProgramFiles(x86) ist nicht gesetzt; signtool kann nicht gesucht werden."
              }
              $signToolPattern = Join-Path $programFilesX86 `
                "Windows Kits/10/bin/*/x64/signtool.exe"
              $signTool = Get-ChildItem -Path $signToolPattern -File `
                -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | `
                Select-Object -First 1
              if ($null -eq $signTool) {
                throw "signtool.exe wurde unter Windows Kits/10/bin nicht gefunden."
              }

              [IO.File]::WriteAllBytes(
                $certificate,
                [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
              )
              & $signTool.FullName sign /fd SHA256 /td SHA256 `
                /tr https://timestamp.digicert.com `
                /f $certificate /p $env:WINDOWS_CERTIFICATE_PASSWORD `
                "dist/BitTorrent-Beobachter/BitTorrent-Beobachter.exe"
              if ($LASTEXITCODE -ne 0) {
                throw "signtool.exe ist mit Exitcode $LASTEXITCODE fehlgeschlagen."
              }
              & $signTool.FullName verify /pa /all `
                "dist/BitTorrent-Beobachter/BitTorrent-Beobachter.exe"
              if ($LASTEXITCODE -ne 0) {
                throw (
                  "Die Signaturprüfung ist mit Exitcode " +
                  "$LASTEXITCODE fehlgeschlagen."
                )
              }
            } finally {
              if (Test-Path -LiteralPath $certificate) {
                Remove-Item -LiteralPath $certificate -Force
              }
            }
          } else {
            Write-Host (
              "Kein Codesigning-Zertifikat hinterlegt; " +
              "Build bleibt nachvollziehbar, aber unsigniert."
            )
          }

      - name: Download-Ordner vorbereiten
        shell: pwsh
        run: |
          Copy-Item -LiteralPath "README.md" `
            -Destination "dist/BitTorrent-Beobachter/README.md" -Force
          Copy-Item -LiteralPath "LICENSE" `
            -Destination "dist/BitTorrent-Beobachter/LICENSE" -Force
          Copy-Item -LiteralPath "THIRD_PARTY_NOTICES.md" `
            -Destination "dist/BitTorrent-Beobachter/THIRD_PARTY_NOTICES.md" -Force
          $pdfSource = `
            "assets/Cybercrime-E-Mail-Kontakte_BKA-und-LKA_Deutschland_Stand-2026-10-20.pdf"
          $expectedPdfHash = `
            "75585bb562b705f5644734299f78d1b26f1bd083a4acd962d21704041feb2f12"
          $actualPdfHash = (
            Get-FileHash -Algorithm SHA256 -LiteralPath $pdfSource
          ).Hash.ToLowerInvariant()
          if ($actualPdfHash -ne $expectedPdfHash) {
            throw "Die Prüfsumme der Kontakt-PDF stimmt nicht."
          }
          Copy-Item -LiteralPath $pdfSource `
            -Destination "dist/BitTorrent-Beobachter/Cybercrime-E-Mail-Kontakte_BKA-und-LKA_Deutschland_Stand-2026-10-20.pdf" `
            -Force
          $checksums = @(
            "BitTorrent-Beobachter.exe",
            "Cybercrime-E-Mail-Kontakte_BKA-und-LKA_Deutschland_Stand-2026-10-20.pdf"
          ) | ForEach-Object {
            $filePath = Join-Path "dist/BitTorrent-Beobachter" $_
            $hash = (
              Get-FileHash -Algorithm SHA256 -LiteralPath $filePath
            ).Hash.ToLowerInvariant()
            "$hash  $_"
          }
          $checksums | Set-Content -Encoding ascii `
            "dist/BitTorrent-Beobachter/SHA256SUMS.txt"

      - name: Geprüften Build bereitstellen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AfDLeakercatcher-Windows-x64
          path: dist/BitTorrent-Beobachter
          if-no-files-found: error

  attest-public-build:
    if: >-
      ${{ github.event.repository.visibility == 'public' &&
          ((github.event_name == 'push' &&
            (github.ref == 'refs/heads/main' ||
             startsWith(github.ref, 'refs/tags/v') ||
             startsWith(github.ref, 'refs/tags/bittorrent-beobachter-v'))) ||
           (github.event_name == 'workflow_dispatch' &&
            github.ref == 'refs/heads/main')) }}
    needs: test-and-build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Geprüften Build herunterladen
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: AfDLeakercatcher-Windows-x64
          path: attest

      - name: Herkunftsnachweis erzeugen
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: attest/BitTorrent-Beobachter.exe

  github-release:
    if: >-
      ${{ always() &&
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' ||
           startsWith(github.ref, 'refs/tags/v') ||
           startsWith(github.ref, 'refs/tags/bittorrent-beobachter-v')) &&
          needs.test-and-build-windows.result == 'success' &&
          (needs.attest-public-build.result == 'success' ||
           needs.attest-public-build.result == 'skipped') }}
    needs: [test-and-build-windows, attest-public-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Release-Ziel bestimmen
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
            release_tag="bittorrent-beobachter-v${version}"
          else
            release_tag="$GITHUB_REF_NAME"
          fi
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $release_tag existiert bereits."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Geprüften Build herunterladen
        if: ${{ steps.release.outputs.exists != 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: AfDLeakercatcher-Windows-x64
          path: release/package

      - name: Einmal entpackbares Release-ZIP erstellen
        if: ${{ steps.release.outputs.exists != 'true' }}
        run: |
          cd release/package
          zip -r ../AfDLeakercatcher-Windows-x64.zip .
          cd ..
          sha256sum AfDLeakercatcher-Windows-x64.zip > AfDLeakercatcher-Windows-x64.zip.sha256

      - name: GitHub-Release erstellen
        if: ${{ steps.release.outputs.exists != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          release_args=(--repo "$GITHUB_REPOSITORY" --generate-notes)
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            release_args+=(--target "$GITHUB_SHA")
          else
            release_args+=(--verify-tag)
          fi
          gh release create "$RELEASE_TAG" \
            "${release_args[@]}" \
            "release/AfDLeakercatcher-Windows-x64.zip" \
            "release/AfDLeakercatcher-Windows-x64.zip.sha256"

          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = "false"
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')" = "2"
