name: AfDLeakerCatcher prüfen und bauen

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"
      - "afdleakercatcher-v*"
      - "bittorrent-beobachter-v*"
  pull_request:

permissions:
  contents: read

jobs:
  test-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Python einrichten
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: requirements-build.lock

      - name: Versionsangaben und Release-Tag pruefen
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          app_version="$(python -c 'from bittorrent_beobachter import VERSION; print(VERSION)')"
          if [[ "$package_version" != "$app_version" ]]; then
            echo "Paketversion $package_version und App-Version $app_version stimmen nicht ueberein." >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* && \
                "$GITHUB_REF_NAME" != "v${package_version}" && \
                "$GITHUB_REF_NAME" != "afdleakercatcher-v${package_version}" && \
                "$GITHUB_REF_NAME" != "bittorrent-beobachter-v${package_version}" ]]; then
            echo "Release-Tag $GITHUB_REF_NAME passt nicht zur Version $package_version." >&2
            exit 1
          fi

      - name: Abhängigkeiten installieren
        run: python -m pip install --require-hashes -r requirements-build.lock

      - name: Tests ausführen
        run: python -m pytest

      - name: Quellcode prüfen
        run: python -m ruff check .

      - name: Python-Dateien kompilieren
        run: >-
          python -m compileall -q
          164_bittorrent_beobachter.py
          bittorrent_beobachter
          tests

  test-and-build-windows:
    needs: test-linux
    runs-on: windows-latest

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Python einrichten
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: requirements-build.lock

      - name: Abhängigkeiten installieren
        run: python -m pip install --require-hashes -r requirements-build.lock

      - name: Tests ausführen
        run: python -m pytest

      - name: Quellcode prüfen
        run: python -m ruff check .

      - name: Gebündelte Laufzeitversionen prüfen
        shell: pwsh
        run: |
          $tkCheck = @'
          import platform
          import ssl
          import tkinter as tk

          expected_python = "3.14.8"
          expected_tcl_tk = "9.0.4"
          expected_openssl = "OpenSSL 3.5.9 29 Sep 2026"
          actual_python = platform.python_version()
          actual_openssl = ssl.OPENSSL_VERSION
          if actual_python != expected_python:
              raise RuntimeError(
                  f"Python {actual_python} statt {expected_python} gefunden."
              )
          if actual_openssl != expected_openssl:
              raise RuntimeError(
                  f"{actual_openssl} statt {expected_openssl} gefunden."
              )

          root = tk.Tk()
          try:
              root.withdraw()
              root.update_idletasks()
              actual_tcl = str(root.tk.call("info", "patchlevel"))
              actual_tk = str(root.tk.call("package", "provide", "Tk"))
              if actual_tcl != expected_tcl_tk or actual_tk != expected_tcl_tk:
                  raise RuntimeError(
                      f"Tcl/Tk {actual_tcl}/{actual_tk} statt "
                      f"{expected_tcl_tk}/{expected_tcl_tk} gefunden."
                  )
              print(
                  f"Python {actual_python} mit Tcl/Tk "
                  f"{actual_tcl}/{actual_tk} und {actual_openssl} ist verfügbar."
              )
          finally:
              root.destroy()
          '@
          $tkCheck | python -
          if ($LASTEXITCODE -ne 0) {
            throw "Die Tkinter-Laufzeitprüfung ist fehlgeschlagen."
          }

      - name: Transparente Onedir-App bauen
        run: python -m PyInstaller --clean --noconfirm BitTorrentBeobachter.spec

      - name: Gebündeltes Runtime-Inventar prüfen
        shell: pwsh
        run: |
          $internalDirectory = Resolve-Path -LiteralPath `
            "dist/AfDLeakerCatcher/_internal"
          $runtimeFiles = @(
            Get-ChildItem -LiteralPath $internalDirectory.Path -Recurse -File
          )
          $expectedRuntimeNames = @(
            "python314.dll",
            "tcl90.dll",
            "tcl9tk90.dll",
            "libcrypto-3.dll",
            "libssl-3.dll"
          )
          foreach ($name in $expectedRuntimeNames) {
            $runtimeMatches = @(
              $runtimeFiles | Where-Object { $_.Name -ceq $name }
            )
            if ($runtimeMatches.Count -ne 1) {
              throw "Das Windows-Paket enthält $name nicht genau einmal."
            }
            $runtimeFile = $runtimeMatches[0]
            if ($runtimeFile.Length -le 0) {
              throw "Leere Laufzeitdatei: $($runtimeFile.FullName)"
            }
            $runtimeHash = (
              Get-FileHash -Algorithm SHA256 -LiteralPath $runtimeFile.FullName
            ).Hash.ToLowerInvariant()
            $runtimeDescription = (
              "{0} ({1} Byte, SHA-256 {2})" -f `
                $runtimeFile.Name, $runtimeFile.Length, $runtimeHash
            )
            Write-Host "Runtime-Inventar: $runtimeDescription"
          }
          $versionedPythonLibraries = @(
            $runtimeFiles | Where-Object {
              $_.Name -match '^python3[0-9]{2}\.dll$'
            }
          )
          if (
            $versionedPythonLibraries.Count -ne 1 -or
            $versionedPythonLibraries[0].Name -cne "python314.dll"
          ) {
            throw "Unerwartete gebündelte Python-Laufzeitbibliothek."
          }
          $openSslLibraries = @(
            $runtimeFiles | Where-Object {
              $_.Name -like "libcrypto-3*.dll" -or
              $_.Name -like "libssl-3*.dll"
            }
          )
          if (
            $openSslLibraries.Count -ne 2 -or
            @($openSslLibraries | Where-Object {
              $_.Name -notin @("libcrypto-3.dll", "libssl-3.dll")
            }).Count -ne 0
          ) {
            throw "Unerwartete gebündelte OpenSSL-3-Bibliotheken."
          }

      - name: Gebaute EXE prüfen
        shell: pwsh
        run: |
          $executable = Resolve-Path -LiteralPath `
            "dist/AfDLeakerCatcher/AfDLeakerCatcher.exe"
          $process = Start-Process -FilePath $executable.Path `
            -ArgumentList "--version" -PassThru
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            $process.WaitForExit()
            throw "Der EXE-Smoke-Test wurde nach 30 Sekunden abgebrochen."
          }
          if ($process.ExitCode -ne 0) {
            throw (
              "Der EXE-Smoke-Test ist mit Exitcode " +
              "$($process.ExitCode) fehlgeschlagen."
            )
          }
          Write-Host "EXE-Smoke-Test mit --version erfolgreich."

      - name: Gebündelte GUI-Laufzeit prüfen
        shell: pwsh
        run: |
          $executable = Resolve-Path -LiteralPath `
            "dist/AfDLeakerCatcher/AfDLeakerCatcher.exe"
          $process = Start-Process -FilePath $executable.Path `
            -ArgumentList "--gui-smoke-test" -PassThru
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            $process.WaitForExit()
            throw "Der GUI-Smoke-Test wurde nach 30 Sekunden abgebrochen."
          }
          if ($process.ExitCode -ne 0) {
            throw (
              "Der GUI-Smoke-Test ist mit Exitcode " +
              "$($process.ExitCode) fehlgeschlagen."
            )
          }
          Write-Host "Gebündelte Tkinter-GUI erfolgreich gestartet und beendet."

      - name: EXE optional mit Herausgeberzertifikat signieren
        if: >-
          ${{
            (github.event_name == 'push' &&
             (github.ref == 'refs/heads/main' ||
              startsWith(github.ref, 'refs/tags/v') ||
              startsWith(github.ref, 'refs/tags/afdleakercatcher-v') ||
              startsWith(github.ref, 'refs/tags/bittorrent-beobachter-v'))) ||
            (github.event_name == 'workflow_dispatch' &&
             github.ref == 'refs/heads/main')
          }}
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            $certificate = Join-Path $env:RUNNER_TEMP "code-signing.pfx"
            try {
              $programFilesX86 = ${env:ProgramFiles(x86)}
              if ([string]::IsNullOrWhiteSpace($programFilesX86)) {
                throw "ProgramFiles(x86) ist nicht gesetzt; signtool kann nicht gesucht werden."
              }
              $signToolPattern = Join-Path $programFilesX86 `
                "Windows Kits/10/bin/*/x64/signtool.exe"
              $signTool = Get-ChildItem -Path $signToolPattern -File `
                -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | `
                Select-Object -First 1
              if ($null -eq $signTool) {
                throw "signtool.exe wurde unter Windows Kits/10/bin nicht gefunden."
              }

              [IO.File]::WriteAllBytes(
                $certificate,
                [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
              )
              & $signTool.FullName sign /fd SHA256 /td SHA256 `
                /tr https://timestamp.digicert.com `
                /f $certificate /p $env:WINDOWS_CERTIFICATE_PASSWORD `
                "dist/AfDLeakerCatcher/AfDLeakerCatcher.exe"
              if ($LASTEXITCODE -ne 0) {
                throw "signtool.exe ist mit Exitcode $LASTEXITCODE fehlgeschlagen."
              }
              & $signTool.FullName verify /pa /all `
                "dist/AfDLeakerCatcher/AfDLeakerCatcher.exe"
              if ($LASTEXITCODE -ne 0) {
                throw (
                  "Die Signaturprüfung ist mit Exitcode " +
                  "$LASTEXITCODE fehlgeschlagen."
                )
              }
            } finally {
              if (Test-Path -LiteralPath $certificate) {
                Remove-Item -LiteralPath $certificate -Force
              }
            }
          } else {
            Write-Host (
              "Kein Codesigning-Zertifikat hinterlegt; " +
              "Build bleibt nachvollziehbar, aber unsigniert."
            )
          }

      - name: Download-Ordner vorbereiten
        shell: pwsh
        run: |
          Copy-Item -LiteralPath "README.md" `
            -Destination "dist/AfDLeakerCatcher/README.md" -Force
          Copy-Item -LiteralPath "LICENSE" `
            -Destination "dist/AfDLeakerCatcher/LICENSE" -Force
          Copy-Item -LiteralPath "THIRD_PARTY_NOTICES.md" `
            -Destination "dist/AfDLeakerCatcher/THIRD_PARTY_NOTICES.md" -Force
          Copy-Item -LiteralPath "requirements-build.lock" `
            -Destination "dist/AfDLeakerCatcher/requirements-build.lock" -Force
          $internalDirectory = "dist/AfDLeakerCatcher/_internal"
          $resultIllustration = (
            "dist/AfDLeakerCatcher/_internal/" +
            "bittorrent_beobachter/assets/leaker_chase.png"
          )
          $expectedResultIllustrationHash = (
            "9ea29e8488c1459390c528c3caebab9fc" +
            "38e3b264439d721fce6b1c59a721902"
          )
          if (-not (Test-Path -LiteralPath $resultIllustration -PathType Leaf)) {
            throw "Das dekorative Ergebnisbild fehlt im Paket: $resultIllustration"
          }
          $actualResultIllustrationHash = (
            Get-FileHash -Algorithm SHA256 -LiteralPath $resultIllustration
          ).Hash.ToLowerInvariant()
          if ($actualResultIllustrationHash -ne $expectedResultIllustrationHash) {
            throw "Die Prüfsumme des dekorativen Ergebnisbilds stimmt nicht."
          }
          $cryptoLibraries = @(
            Get-ChildItem -LiteralPath $internalDirectory -File |
              Where-Object { $_.Name -like "libcrypto-3*.dll" }
          )
          $sslLibraries = @(
            Get-ChildItem -LiteralPath $internalDirectory -File |
              Where-Object { $_.Name -like "libssl-3*.dll" }
          )
          if ($cryptoLibraries.Count -ne 1 -or $sslLibraries.Count -ne 1) {
            throw "Das Paket enthält nicht genau eine OpenSSL-3-Crypto- und SSL-Bibliothek."
          }
          foreach ($library in @($cryptoLibraries + $sslLibraries)) {
            if ($library.Length -le 0) {
              throw "Das Paket enthält eine leere OpenSSL-Bibliothek: $($library.FullName)"
            }
          }
          $licenseNames = @(
            "Python-3.14.8.txt",
            "Tcl-9.0.4.txt",
            "Tk-9.0.4.txt",
            "OpenSSL-3.5.9-LICENSE.txt",
            "OpenSSL-3.5.9-ACKNOWLEDGEMENTS.md",
            "ReportLab-4.5.1.txt",
            "Pillow-13.0.0.txt",
            "charset-normalizer-3.5.2.txt",
            "PyInstaller-6.22.3.txt"
          ) | Sort-Object
          $licenseSource = "THIRD_PARTY_LICENSES"
          $licenseDestination = `
            "dist/AfDLeakerCatcher/THIRD_PARTY_LICENSES"
          $sourceLicenseNames = @(
            Get-ChildItem -LiteralPath $licenseSource -File |
              Select-Object -ExpandProperty Name |
              Sort-Object
          )
          if (@(
            Compare-Object -ReferenceObject $licenseNames `
              -DifferenceObject $sourceLicenseNames
          ).Count -ne 0) {
            throw "Der Quellordner mit Drittanbieter-Lizenzen ist unvollständig."
          }
          foreach ($licenseName in $licenseNames) {
            $licensePath = Join-Path $licenseSource $licenseName
            if ((Get-Item -LiteralPath $licensePath).Length -le 0) {
              throw "Der Drittanbieter-Lizenztext ist leer: $licensePath"
            }
          }
          Copy-Item -LiteralPath $licenseSource `
            -Destination $licenseDestination -Recurse -Force
          $packagedLicenseNames = @(
            Get-ChildItem -LiteralPath $licenseDestination -File |
              Select-Object -ExpandProperty Name |
              Sort-Object
          )
          if (@(
            Compare-Object -ReferenceObject $licenseNames `
              -DifferenceObject $packagedLicenseNames
          ).Count -ne 0) {
            throw "Der Paketordner mit Drittanbieter-Lizenzen ist unvollständig."
          }
          $pdfSource = `
            "assets/Cybercrime-E-Mail-Kontakte_BKA-und-LKA_Deutschland_Stand-2026-10-20.pdf"
          $expectedPdfHash = `
            "75585bb562b705f5644734299f78d1b26f1bd083a4acd962d21704041feb2f12"
          $actualPdfHash = (
            Get-FileHash -Algorithm SHA256 -LiteralPath $pdfSource
          ).Hash.ToLowerInvariant()
          if ($actualPdfHash -ne $expectedPdfHash) {
            throw "Die Prüfsumme der Kontakt-PDF stimmt nicht."
          }
          Copy-Item -LiteralPath $pdfSource `
            -Destination "dist/AfDLeakerCatcher/Cybercrime-E-Mail-Kontakte_BKA-und-LKA_Deutschland_Stand-2026-10-20.pdf" `
            -Force
          $onePagerName = "AfDLeakerCatcher-Kurzuebersicht.pdf"
          $expectedOnePagerHash = `
            "8c3ab4ec26ffa978a5059b2367b7d52669d3da195627ca2c5b9ec0b46522fbd1"
          $actualOnePagerHash = (
            Get-FileHash -Algorithm SHA256 -LiteralPath $onePagerName
          ).Hash.ToLowerInvariant()
          if ($actualOnePagerHash -ne $expectedOnePagerHash) {
            throw "Die Prüfsumme der Kurzuebersicht stimmt nicht."
          }
          Copy-Item -LiteralPath $onePagerName `
            -Destination "dist/AfDLeakerCatcher/$onePagerName" -Force
          $checksums = @(
            "AfDLeakerCatcher.exe",
            "Cybercrime-E-Mail-Kontakte_BKA-und-LKA_Deutschland_Stand-2026-10-20.pdf",
            $onePagerName
          ) | ForEach-Object {
            $filePath = Join-Path "dist/AfDLeakerCatcher" $_
            $hash = (
              Get-FileHash -Algorithm SHA256 -LiteralPath $filePath
            ).Hash.ToLowerInvariant()
            "$hash  $_"
          }
          $checksums | Set-Content -Encoding ascii `
            "dist/AfDLeakerCatcher/SHA256SUMS.txt"

      - name: Finales einmal entpackbares Release-ZIP erstellen
        shell: pwsh
        run: |
          $packageDirectory = (
            Resolve-Path -LiteralPath "dist/AfDLeakerCatcher"
          ).Path
          $releaseDirectory = Join-Path $PWD "dist/release"
          New-Item -ItemType Directory -Path $releaseDirectory -Force | Out-Null
          $archiveName = "AfDLeakerCatcher-Windows-x64.zip"
          $archive = Join-Path $releaseDirectory $archiveName
          if (Test-Path -LiteralPath $archive) {
            Remove-Item -LiteralPath $archive -Force
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            $packageDirectory,
            $archive,
            [System.IO.Compression.CompressionLevel]::Optimal,
            $false
          )
          $expectedLicenseEntries = @(
            "Python-3.14.8.txt",
            "Tcl-9.0.4.txt",
            "Tk-9.0.4.txt",
            "OpenSSL-3.5.9-LICENSE.txt",
            "OpenSSL-3.5.9-ACKNOWLEDGEMENTS.md",
            "ReportLab-4.5.1.txt",
            "Pillow-13.0.0.txt",
            "charset-normalizer-3.5.2.txt",
            "PyInstaller-6.22.3.txt"
          ) | ForEach-Object { "THIRD_PARTY_LICENSES/$_" } | Sort-Object
          $zipArchive = [System.IO.Compression.ZipFile]::OpenRead($archive)
          try {
            $licenseEntries = @(
              $zipArchive.Entries | Where-Object {
                -not [string]::IsNullOrEmpty($_.Name) -and
                $_.FullName.Replace("\", "/").StartsWith(
                  "THIRD_PARTY_LICENSES/",
                  [StringComparison]::Ordinal
                )
              }
            )
            $actualLicenseEntries = @(
              $licenseEntries |
                ForEach-Object { $_.FullName.Replace("\", "/") } |
                Sort-Object
            )
            if (@(
              Compare-Object -ReferenceObject $expectedLicenseEntries `
                -DifferenceObject $actualLicenseEntries
            ).Count -ne 0) {
              throw "Das Release-ZIP enthält nicht alle Drittanbieter-Lizenztexte."
            }
            foreach ($licenseEntry in $licenseEntries) {
              if ($licenseEntry.Length -le 0) {
                throw "Leerer Lizenztext im Release-ZIP: $($licenseEntry.FullName)"
              }
            }
          } finally {
            $zipArchive.Dispose()
          }
          $hash = (
            Get-FileHash -Algorithm SHA256 -LiteralPath $archive
          ).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(
            "$archive.sha256",
            "$hash  $archiveName`n",
            [Text.Encoding]::ASCII
          )
          Write-Host "Finales Release-ZIP: $archive"
          Write-Host "SHA-256: $hash"

      - name: Geprüften Build bereitstellen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: AfDLeakerCatcher-Windows-x64
          path: dist/AfDLeakerCatcher
          if-no-files-found: error

      - name: Unveränderte Release-Dateien bereitstellen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: AfDLeakerCatcher-Windows-x64-release
          path: |
            dist/release/AfDLeakerCatcher-Windows-x64.zip
            dist/release/AfDLeakerCatcher-Windows-x64.zip.sha256
          if-no-files-found: error

  attest-public-build:
    if: >-
      ${{ github.event.repository.visibility == 'public' &&
          ((github.event_name == 'push' &&
            (github.ref == 'refs/heads/main' ||
             startsWith(github.ref, 'refs/tags/v') ||
             startsWith(github.ref, 'refs/tags/afdleakercatcher-v') ||
             startsWith(github.ref, 'refs/tags/bittorrent-beobachter-v'))) ||
           (github.event_name == 'workflow_dispatch' &&
            github.ref == 'refs/heads/main')) }}
    needs: test-and-build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Geprüften Build herunterladen
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: AfDLeakerCatcher-Windows-x64-release
          path: attest

      - name: Herkunftsnachweis erzeugen
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: attest/AfDLeakerCatcher-Windows-x64.zip

  github-release:
    if: >-
      ${{ always() &&
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' ||
           startsWith(github.ref, 'refs/tags/v') ||
           startsWith(github.ref, 'refs/tags/afdleakercatcher-v') ||
           startsWith(github.ref, 'refs/tags/bittorrent-beobachter-v')) &&
          needs.test-and-build-windows.result == 'success' &&
          (needs.attest-public-build.result == 'success' ||
           needs.attest-public-build.result == 'skipped') }}
    needs: [test-and-build-windows, attest-public-build]
    runs-on: ubuntu-latest
    concurrency:
      group: afdleakercatcher-github-release
      cancel-in-progress: false
    permissions:
      attestations: read
      contents: write

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Release-Ziel bestimmen
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          app_version="$(python -c 'from bittorrent_beobachter import VERSION; print(VERSION)')"
          if [[ "$version" != "$app_version" ]]; then
            echo "Paketversion $version und App-Version $app_version stimmen nicht ueberein." >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            release_tag="afdleakercatcher-v${version}"
          else
            release_tag="$GITHUB_REF_NAME"
            if [[ "$release_tag" != "v${version}" && \
                  "$release_tag" != "afdleakercatcher-v${version}" && \
                  "$release_tag" != "bittorrent-beobachter-v${version}" ]]; then
              echo "Release-Tag $release_tag passt nicht zur Version $version." >&2
              exit 1
            fi
          fi
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $release_tag existiert bereits."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Unveränderte Release-Dateien herunterladen
        if: ${{ steps.release.outputs.exists != 'true' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: AfDLeakerCatcher-Windows-x64-release
          path: release

      - name: GitHub-Release erstellen
        if: ${{ steps.release.outputs.exists != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          release_args=(--repo "$GITHUB_REPOSITORY" --generate-notes)
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            release_args+=(--target "$GITHUB_SHA")
          else
            release_args+=(--verify-tag)
          fi
          gh release create "$RELEASE_TAG" \
            "${release_args[@]}" \
            "release/AfDLeakerCatcher-Windows-x64.zip" \
            "release/AfDLeakerCatcher-Windows-x64.zip.sha256"

      - name: Vorhandenes oder neu erstelltes Release vollständig prüfen
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          set -euo pipefail
          if [[ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                    --json isDraft --jq '.isDraft')" != "false" ]]; then
            echo "Release $RELEASE_TAG ist noch ein Entwurf." >&2
            exit 1
          fi

          resolved_commit="$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')"
          if [[ "$resolved_commit" != "$GITHUB_SHA" ]]; then
            echo "Release $RELEASE_TAG zeigt auf $resolved_commit statt $GITHUB_SHA." >&2
            exit 1
          fi

          printf -v expected_assets '%s\n%s' \
            "AfDLeakerCatcher-Windows-x64.zip" \
            "AfDLeakerCatcher-Windows-x64.zip.sha256"
          actual_assets="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | LC_ALL=C sort)"
          if [[ "$actual_assets" != "$expected_assets" ]]; then
            echo "Release $RELEASE_TAG enthält unerwartete oder fehlende Assets:" >&2
            printf '%s\n' "$actual_assets" >&2
            exit 1
          fi

          verification_dir="$RUNNER_TEMP/release-verification"
          mkdir -p "$verification_dir"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir "$verification_dir" \
            --pattern "AfDLeakerCatcher-Windows-x64.zip" \
            --pattern "AfDLeakerCatcher-Windows-x64.zip.sha256"
          cd "$verification_dir"
          sha256sum --check --strict AfDLeakerCatcher-Windows-x64.zip.sha256
          if [[ "$REPOSITORY_VISIBILITY" == "public" ]]; then
            gh attestation verify AfDLeakerCatcher-Windows-x64.zip \
              --repo "$GITHUB_REPOSITORY"
          fi
